<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-label="WayCampus campus navigation platform">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
    <style>
      .float { animation: float 5s ease-in-out infinite; }
      .float2 { animation: float 6s ease-in-out 1s infinite; }
      .dash { stroke-dasharray: 10 12; animation: dash 3s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin:center; }
      @keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
      @keyframes dash { to { stroke-dashoffset: -44; } }
      @keyframes pulse { 0%,100% { opacity:.35; transform:scale(1); } 50% { opacity:.85; transform:scale(1.08); } }
    </style>
  </defs>
  <rect width="1400" height="360" rx="28" fill="url(#g)"/>
  <circle cx="115" cy="80" r="90" fill="#38bdf8" opacity=".16" filter="url(#blur)" class="pulse"/>
  <circle cx="1250" cy="290" r="110" fill="#818cf8" opacity=".14" filter="url(#blur)" class="pulse"/>
  <g opacity=".12">
    <path d="M0 90H1400M0 180H1400M0 270H1400" stroke="#fff"/>
    <path d="M140 0V360M280 0V360M420 0V360M560 0V360M700 0V360M840 0V360M980 0V360M1120 0V360M1260 0V360" stroke="#fff"/>
  </g>

  <g transform="translate(90 74)" class="float">
    <circle cx="34" cy="34" r="34" fill="#0b1220" stroke="#334155"/>
    <path d="M34 12 42 27 57 34 42 42 34 58 26 42 11 34 26 27Z" fill="url(#glow)"/>
    <circle cx="34" cy="34" r="6" fill="#fff"/>
  </g>

  <text x="170" y="122" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="70" font-weight="800" letter-spacing="-2">WayCampus</text>
  <text x="174" y="166" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Smart indoor campus navigation • 3D • 360° • QR • PWA</text>

  <g transform="translate(170 208)">
    <rect x="0" y="0" width="155" height="42" rx="21" fill="#0b1220" stroke="#334155"/>
    <circle cx="22" cy="21" r="6" fill="#38bdf8"/>
    <text x="40" y="28" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Live navigation</text>
    <rect x="165" y="0" width="125" height="42" rx="21" fill="#0b1220" stroke="#334155"/>
    <circle cx="187" cy="21" r="6" fill="#818cf8"/>
    <text x="205" y="28" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">360° tour</text>
    <rect x="300" y="0" width="105" height="42" rx="21" fill="#0b1220" stroke="#334155"/>
    <circle cx="322" cy="21" r="6" fill="#a7f3d0"/>
    <text x="340" y="28" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">QR</text>
  </g>

  <g transform="translate(845 70)" class="float2">
    <rect x="0" y="0" width="430" height="230" rx="28" fill="#0b1220" stroke="#334155"/>
    <rect x="22" y="22" width="386" height="150" rx="18" fill="#101827"/>
    <path d="M58 136 C122 85 160 116 211 86 S316 58 370 108" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" class="dash"/>
    <circle cx="58" cy="136" r="11" fill="#fff" stroke="#38bdf8" stroke-width="5"/>
    <circle cx="370" cy="108" r="11" fill="#fff" stroke="#818cf8" stroke-width="5"/>
    <text x="26" y="204" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Route graph → panorama → destination</text>
  </g>
</svg>