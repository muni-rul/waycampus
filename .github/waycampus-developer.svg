<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-label="WayCampus developer console">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .blink{animation:blink 1.2s steps(1,end) infinite}
      .float{animation:float 5s ease-in-out infinite}
      .dash{stroke-dasharray:8 10;animation:dash 2.8s linear infinite}
      @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:.1}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes dash{to{stroke-dashoffset:-54}}
    </style>
  </defs>

  <rect width="1400" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="170" cy="85" r="110" fill="#22d3ee" opacity=".12" filter="url(#glow)"/>
  <circle cx="1230" cy="430" r="140" fill="#818cf8" opacity=".12" filter="url(#glow)"/>

  <g opacity=".08">
    <path d="M0 100H1400M0 200H1400M0 300H1400M0 400H1400" stroke="#fff"/>
    <path d="M200 0V520M400 0V520M600 0V520M800 0V520M1000 0V520M1200 0V520" stroke="#fff"/>
  </g>

  <g transform="translate(72 66)" class="float">
    <circle cx="42" cy="42" r="42" fill="#08101f" stroke="#334155" stroke-width="2"/>
    <path d="M42 12 52 31 73 42 52 53 42 74 32 53 11 42 32 31Z" fill="url(#accent)"/>
    <circle cx="42" cy="42" r="8" fill="#fff"/>
  </g>

  <text x="160" y="100" fill="#67e8f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">WAYCAMPUS // DEVELOPER BUILD</text>
  <text x="160" y="165" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="70" font-weight="800" letter-spacing="-2">Navigate the campus.</text>
  <text x="160" y="215" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">React • TypeScript • Three.js • Express • 360° • QR • PWA</text>

  <g transform="translate(160 252)">
    <rect width="500" height="188" rx="22" fill="#020617" stroke="#334155"/>
    <circle cx="24" cy="22" r="6" fill="#fb7185"/>
    <circle cx="44" cy="22" r="6" fill="#fbbf24"/>
    <circle cx="64" cy="22" r="6" fill="#34d399"/>
    <text x="26" y="58" fill="#64748b" font-family="monospace" font-size="14">waycampus://production</text>
    <text x="26" y="91" fill="#67e8f9" font-family="monospace" font-size="17">$ route --from "Gate" --to "Room 153"</text>
    <text x="26" y="121" fill="#a7f3d0" font-family="monospace" font-size="17">✓ graph path resolved</text>
    <text x="26" y="149" fill="#c4b5fd" font-family="monospace" font-size="17">→ 360° panorama sequence ready</text>
    <text x="26" y="177" fill="#94a3b8" font-family="monospace" font-size="17">$ <tspan class="blink">_</tspan></text>
  </g>

  <g transform="translate(730 242)">
    <rect width="590" height="198" rx="26" fill="#08101f" stroke="#334155"/>
    <text x="28" y="42" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">LIVE NAVIGATION PIPELINE</text>
    <path d="M55 139 C128 70 201 149 281 98 S425 52 520 112" fill="none" stroke="#22d3ee" stroke-width="7" stroke-linecap="round" class="dash"/>
    <circle cx="55" cy="139" r="10" fill="#fff" stroke="#22d3ee" stroke-width="5"/>
    <circle cx="520" cy="112" r="10" fill="#fff" stroke="#818cf8" stroke-width="5"/>
    <g transform="translate(38 155)">
      <rect width="110" height="28" rx="14" fill="#0f172a" stroke="#334155"/>
      <text x="20" y="19" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">SEARCH</text>
      <rect x="120" width="110" height="28" rx="14" fill="#0f172a" stroke="#334155"/>
      <text x="145" y="19" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">ROUTE</text>
      <rect x="240" width="120" height="28" rx="14" fill="#0f172a" stroke="#334155"/>
      <text x="263" y="19" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">PANORAMA</text>
      <rect x="370" width="110" height="28" rx="14" fill="#0f172a" stroke="#334155"/>
      <text x="393" y="19" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">ARRIVE</text>
    </g>
  </g>

  <text x="72" y="480" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Production-oriented campus navigation platform • built for mobile-first wayfinding</text>
</svg>